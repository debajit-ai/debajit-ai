<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="oBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="50%" stop-color="#0E0818"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#00B7FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>

    <pattern id="oGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2E1065" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#oBg)"/>
  <rect width="1200" height="480" fill="url(#oGrid)"/>

  <!-- Outer HUD Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="none" stroke="#2E1065" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="432" rx="6" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.4"/>

  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 15 435 L 15 465 L 45 465" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 1155 465 L 1185 465 L 1185 435" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(45, 52)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="3px" fill="#FFFFFF">
      ORION HELIX AI <tspan fill="#D4AF37">//</tspan> INTELLIGENCE CORE &amp; NEURAL PATHWAYS
    </text>
    <text x="0" y="20" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.5px" fill="#9CA3AF">
      HIGH-SPEED INFERENCE ROUTING &#8226; REAL-TIME STREAMING BUS &#8226; COMPOSABLE WORKSPACE
    </text>
  </g>

  <!-- Orbital Rings around Core -->
  <ellipse cx="600" cy="250" rx="420" ry="140" fill="none" stroke="#2E1065" stroke-width="1.2" stroke-dasharray="6,4" stroke-opacity="0.6"/>
  <ellipse cx="600" cy="250" rx="260" ry="85" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Conduits from Models to Core -->
  <line x1="180" y1="150" x2="600" y2="250" stroke="#00B7FF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="180" y1="350" x2="600" y2="250" stroke="#00B7FF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="1020" y1="150" x2="600" y2="250" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="1020" y1="350" x2="600" y2="250" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="600" y1="385" x2="600" y2="250" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- ==================== CENTRAL INTELLIGENCE CORE ==================== -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="85" fill="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="60" fill="#0B0714" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#140D24" stroke="#00B7FF" stroke-width="1">
      <animate attributeName="r" values="48;53;48" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="2px" fill="#D4AF37">
      ORION HELIX
    </text>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="2px" fill="#FFFFFF">
      INTELLIGENCE CORE
    </text>
    <text x="0" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1px" fill="#00E5FF">
      STATEFUL ENGINE
    </text>
  </g>

  <!-- Left Node 1: Groq API Inference -->
  <g transform="translate(60, 110)">
    <rect width="240" height="75" rx="5" fill="#0D0817" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#00E5FF"/>
    <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">Groq API Engine</text>
    <rect x="155" y="8" width="75" height="18" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="192" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#00E5FF">500+ T/S</text>
    <text x="16" y="44" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Ultra-low latency inference</text>
    <text x="16" y="58" font-family="ui-monospace, monospace" font-size="8.5" fill="#6B7280">Llama / Mixtral dynamic routing</text>
  </g>

  <!-- Left Node 2: Google Gemini Multimodal -->
  <g transform="translate(60, 310)">
    <rect width="240" height="75" rx="5" fill="#0D0817" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#00E5FF"/>
    <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">Google Gemini API</text>
    <rect x="155" y="8" width="75" height="18" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="192" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#00E5FF">MULTIMODAL</text>
    <text x="16" y="44" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Deep reasoning &amp; context</text>
    <text x="16" y="58" font-family="ui-monospace, monospace" font-size="8.5" fill="#6B7280">Unified vision &amp; long context</text>
  </g>

  <!-- Right Node 1: Artifact Canvas V4 -->
  <g transform="translate(900, 110)">
    <rect width="240" height="75" rx="5" fill="#0D0817" stroke="#7C3AED" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#A78BFA"/>
    <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">Artifact Canvas V4</text>
    <rect x="155" y="8" width="75" height="18" rx="3" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="192" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#C4B5FD">SHIPPED</text>
    <text x="16" y="44" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Side-by-side execution canvas</text>
    <text x="16" y="58" font-family="ui-monospace, monospace" font-size="8.5" fill="#6B7280">Live code, documents, web views</text>
  </g>

  <!-- Right Node 2: Real-Time Socket.io -->
  <g transform="translate(900, 310)">
    <rect width="240" height="75" rx="5" fill="#0D0817" stroke="#7C3AED" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#A78BFA"/>
    <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">Socket.io Pipeline</text>
    <rect x="155" y="8" width="75" height="18" rx="3" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="192" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#C4B5FD">REAL-TIME</text>
    <text x="16" y="44" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Bidirectional token stream</text>
    <text x="16" y="58" font-family="ui-monospace, monospace" font-size="8.5" fill="#6B7280">Sub-second event propagation</text>
  </g>

  <!-- Bottom Node: Persistent Memory & Vector Recall -->
  <g transform="translate(470, 370)">
    <rect width="260" height="60" rx="5" fill="#0D0817" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="16" cy="20" r="4" fill="#D4AF37"/>
    <text x="28" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">Memory Subsystem</text>
    <rect x="165" y="10" width="85" height="18" rx="3" fill="#D4AF37" fill-opacity="0.15"/>
    <text x="207" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#D4AF37">SESSION + RAG</text>
    <text x="16" y="44" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Short-term buffer &#8226; Vector recall (R&amp;D)</text>
  </g>
</svg>