<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="35%" stop-color="#0B0714"/>
      <stop offset="70%" stop-color="#160D2B"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="hCore" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#2E1065" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B0714" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="hBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00B7FF" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E1065" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="350" fill="url(#hBg)"/>
  <rect width="1200" height="350" fill="url(#hGrid)"/>
  <rect x="150" y="20" width="900" height="310" fill="url(#hCore)"/>

  <!-- Outer Cyber Brackets -->
  <rect x="25" y="25" width="1150" height="300" fill="none" stroke="#2E1065" stroke-width="1.2" rx="6"/>
  <rect x="23" y="23" width="1154" height="304" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.3" rx="8"/>

  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="20" cy="20" r="2.5" fill="#00B7FF"/>
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="1180" cy="20" r="2.5" fill="#00B7FF"/>
  <path d="M 20 300 L 20 330 L 50 330" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="20" cy="330" r="2.5" fill="#00B7FF"/>
  <path d="M 1150 330 L 1180 330 L 1180 300" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="1180" cy="330" r="2.5" fill="#00B7FF"/>

  <!-- Telemetry Bar -->
  <g font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2px" fill="#9CA3AF">
    <text x="50" y="52">IDENTITY // FOUNDER-ALPHA-01</text>
    <text x="600" y="52" text-anchor="middle" fill="#D4AF37">SINGULARITY HORIZON TECHNOLOGIES PVT. LTD.</text>
    <text x="1150" y="52" text-anchor="end">LOC: 31.25&#176;N 75.70&#176;E</text>
  </g>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#2E1065" stroke-width="1"/>

  <!-- Founder Name -->
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="12px" fill="#FFFFFF" filter="url(#hGlow)">
    DEBAJIT GOSWAMI
  </text>

  <!-- Luminous Horizon Line -->
  <line x1="200" y1="172" x2="1000" y2="172" stroke="url(#hBeam)" stroke-width="2"/>
  <circle cx="600" cy="172" r="4.5" fill="#D4AF37">
    <animate attributeName="r" values="3.5;6.5;3.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Title & Organization -->
  <text x="600" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="4px" fill="url(#hGold)">
    FOUNDER &amp; CEO &#8226; SINGULARITY HORIZON TECHNOLOGIES PVT. LTD.
  </text>
  
  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3px" fill="#C4B5FD">
    AI SYSTEMS ENGINEER  |  AI/ML DEVELOPER  |  STARTUP FOUNDER
  </text>

  <!-- Flagship Announcement Bar -->
  <g transform="translate(600, 288)">
    <rect x="-350" y="-16" width="700" height="32" rx="6" fill="#140D24" stroke="#2E1065" stroke-width="1.2"/>
    <circle cx="-325" cy="0" r="4" fill="#00B7FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="2px" fill="#FFFFFF">
      FLAGSHIP: <tspan fill="#D4AF37">ORION HELIX AI</tspan> &#8226; GENERATIVE &amp; AGENTIC INTELLIGENCE PLATFORM
    </text>
  </g>

  <!-- Footer Telemetry -->
  <g font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.5px" fill="#6B7280">
    <text x="50" y="318">FOUNDER DIRECTORY // V4.0</text>
    <text x="1150" y="318" text-anchor="end" fill="#9CA3AF">AXIOM: <tspan fill="#D4AF37">SYSTEMS OVER DEMOS</tspan></text>
  </g>
</svg>