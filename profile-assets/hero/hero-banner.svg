<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="35%" stop-color="#0B0714"/>
      <stop offset="70%" stop-color="#160D2B"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    
    <radialGradient id="nebulaCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2E1065" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B0714" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="violetGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00B7FF"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00B7FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E1065" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- Radial Glow Behind Text -->
  <rect x="150" y="20" width="900" height="300" fill="url(#nebulaCore)"/>

  <!-- Outer Frame & Cyber Brackets -->
  <rect x="25" y="25" width="1150" height="290" fill="none" stroke="#2E1065" stroke-width="1.2" stroke-opacity="0.6" rx="6"/>
  <rect x="23" y="23" width="1154" height="294" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.3" rx="8"/>

  <!-- Corner Accent Markers -->
  <!-- Top Left -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="20" cy="20" r="2.5" fill="#00B7FF"/>
  <!-- Top Right -->
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="1180" cy="20" r="2.5" fill="#00B7FF"/>
  <!-- Bottom Left -->
  <path d="M 20 290 L 20 320 L 50 320" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="20" cy="320" r="2.5" fill="#00B7FF"/>
  <!-- Bottom Right -->
  <path d="M 1150 320 L 1180 320 L 1180 290" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="1180" cy="320" r="2.5" fill="#00B7FF"/>

  <!-- Header Telemetry Row -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="2px" fill="#9CA3AF">
    <text x="50" y="52">SYS.ID // DG-2026-ALPHA</text>
    <text x="450" y="52" fill="#D4AF37">ORGANIZATION: SINGULARITY HORIZON TECHNOLOGIES PVT. LTD.</text>
    <text x="1000" y="52" text-anchor="end">LOC: 31.25°N 75.70°E</text>
  </g>

  <!-- Top Accent Divider -->
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#2E1065" stroke-width="1"/>

  <!-- Brand Organization Pill -->
  <g transform="translate(600, 95)">
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#0B0714" stroke="#7C3AED" stroke-width="1.2"/>
    <circle cx="-165" cy="0" r="4" fill="#00B7FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5px" fill="#D4AF37">
      SINGULARITY HORIZON
    </text>
  </g>

  <!-- Primary Name / Visual Identity -->
  <text x="600" y="165" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="10px" fill="#FFFFFF" filter="url(#glow)">
    DEBAJIT GOSWAMI
  </text>

  <!-- Animated Horizon Accent Beam -->
  <line x1="200" y1="188" x2="1000" y2="188" stroke="url(#cyanLine)" stroke-width="2"/>
  <circle cx="600" cy="188" r="4" fill="#D4AF37" filter="url(#softGlow)">
    <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Founder Title & Executive Roles -->
  <text x="600" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" letter-spacing="4px" fill="url(#goldGradient)">
    FOUNDER &amp; CEO &#8226; SINGULARITY HORIZON TECHNOLOGIES PVT. LTD.
  </text>
  
  <text x="600" y="248" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="12" letter-spacing="2.5px" fill="#C4B5FD">
    AI SYSTEMS ENGINEER  |  AI/ML DEVELOPER  |  STARTUP FOUNDER
  </text>

  <!-- Flagship Announcement Bar -->
  <g transform="translate(600, 288)">
    <rect x="-340" y="-15" width="680" height="30" rx="6" fill="#140D24" stroke="#2E1065" stroke-width="1.2"/>
    <circle cx="-315" cy="0" r="4" fill="#D4AF37">
      <animate attributeName="fill" values="#D4AF37;#00B7FF;#D4AF37" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11.5" font-weight="700" letter-spacing="2px" fill="#FFFFFF">
      FLAGSHIP: <tspan fill="#D4AF37">ORION HELIX AI</tspan> &#8226; ARCHITECTING AUTONOMOUS INTELLIGENCE
    </text>
  </g>

  <!-- Bottom Telemetry Nodes -->
  <g font-family="ui-monospace, Menlo, Monaco, monospace" font-size="9.5" letter-spacing="1.5px" fill="#6B7280">
    <text x="50" y="306">STATUS: ACTIVE SYSTEMS BUILD</text>
    <text x="1150" y="306" text-anchor="end" fill="#9CA3AF">AXIOM: <tspan fill="#D4AF37">SYSTEMS OVER DEMOS</tspan></text>
  </g>
</svg>