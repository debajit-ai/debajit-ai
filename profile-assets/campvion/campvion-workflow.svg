    <rect width="200" height="175" rx="5" fill="url(#boxBlue)" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="15" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00E5FF">[STEP 04]</text>
