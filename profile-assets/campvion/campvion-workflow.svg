<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="50%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1A29"/>
      <stop offset="100%" stop-color="#070D14"/>
    </linearGradient>

    <linearGradient id="boxAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B0E"/>
      <stop offset="100%" stop-color="#120D07"/>
    </linearGradient>

    <linearGradient id="boxGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C2018"/>
      <stop offset="100%" stop-color="#06120D"/>
    </linearGradient>

    <pattern id="cGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#cBg)"/>
  <rect width="1200" height="360" fill="url(#cGrid)"/>

  <!-- Outer HUD Frame -->
  <rect x="20" y="15" width="1160" height="330" rx="6" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.5"/>
  <path d="M 15 35 L 15 10 L 40 10" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M 1160 10 L 1185 10 L 1185 35" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M 15 325 L 15 350 L 40 350" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M 1160 350 L 1185 350 L 1185 325" fill="none" stroke="#00E5FF" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(45, 45)">
    <circle cx="8" cy="8" r="5" fill="#00E5FF"/>
    <text x="24" y="13" font-family="system-ui, sans-serif" font-size="15" font-weight="900" letter-spacing="3px" fill="#FFFFFF">
      CAMPVION (PROJECT 55) <tspan fill="#00E5FF">//</tspan> VERIFIED AGENTIC WORKFLOW &amp; APPROVAL GATE
    </text>
    <text x="24" y="29" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5px" fill="#9CA3AF">
      STACK: NEXT.JS FRONTEND &#8226; PYTHON + FASTAPI BACKEND &#8226; SQLITE STATE STORE &#8226; EXECUTION TRACING
    </text>
  </g>

  <!-- 5-STEP WORKFLOW STATE MACHINE -->
  <!-- Step 1: Inbound Goal -->
  <g transform="translate(45, 110)">
    <rect width="200" height="175" rx="5" fill="url(#boxBlue)" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="15" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00E5FF">[STEP 01]</text>
    <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="900" fill="#FFFFFF">Campus Request</text>
    <text x="15" y="70" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Multi-step instruction</text>
    <text x="15" y="85" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Lab booking slot</text>
    <text x="15" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Equipment request</text>
    <text x="15" y="115" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Administrative leave</text>
    <rect x="15" y="135" width="170" height="24" rx="3" fill="#0E1A29" stroke="#00E5FF" stroke-width="0.8"/>
    <text x="100" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#00E5FF">INPUT TRIGGER</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="197" x2="275" y2="197" stroke="#00E5FF" stroke-width="1.5"/>
  <polygon points="275,197 267,193 267,201" fill="#00E5FF"/>

  <!-- Step 2: Goal Decomp -->
  <g transform="translate(275, 110)">
    <rect width="200" height="175" rx="5" fill="url(#boxBlue)" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="15" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00E5FF">[STEP 02]</text>
    <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="900" fill="#FFFFFF">Goal Decomposition</text>
    <text x="15" y="70" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Autonomous planning</text>
    <text x="15" y="85" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Tool selection DAG</text>
    <text x="15" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Parameter validation</text>
    <text x="15" y="115" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Policy threshold check</text>
    <rect x="15" y="135" width="170" height="24" rx="3" fill="#0E1A29" stroke="#00E5FF" stroke-width="0.8"/>
    <text x="100" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#00E5FF">POLICY EVALUATION</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="475" y1="197" x2="505" y2="197" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="505,197 497,193 497,201" fill="#D4AF37"/>

  <!-- Step 3: Suspension & Gate -->
