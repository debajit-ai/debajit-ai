    <text x="15" y="85" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; POST /api/approve/{id}</text>
    <text x="15" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; State restored from DB</text>
    <text x="15" y="115" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Workflow resumed</text>
    <rect x="15" y="135" width="170" height="24" rx="3" fill="#0E1A29" stroke="#00E5FF" stroke-width="0.8"/>
    <text x="100" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#00E5FF">HUMAN VALIDATION</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="935" y1="197" x2="965" y2="197" stroke="#00E5FF" stroke-width="1.5"/>
  <polygon points="965,197 957,193 957,201" fill="#00E5FF"/>

  <!-- Step 5: Successful Execution & Tracing -->
  <g transform="translate(965, 110)">
    <rect width="190" height="175" rx="5" fill="url(#boxGreen)" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="15" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00E5FF">[STEP 05]</text>
    <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="900" fill="#FFFFFF">Execution &amp; Tracing</text>
    <text x="15" y="70" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Verified completion</text>
    <text x="15" y="85" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; External API executed</text>
    <text x="15" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Full audit log stored</text>
    <text x="15" y="115" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; User notified</text>
    <rect x="15" y="135" width="160" height="24" rx="3" fill="#0C2018" stroke="#00E5FF" stroke-width="0.8"/>
    <text x="95" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#00E5FF">COMPLETED (200 OK)</text>
  </g>

  <!-- Bottom Telemetry -->
  <g font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.5px" fill="#6B7280">
    <text x="45" y="325">PARADIGM: HUMAN-IN-THE-LOOP SAFETY ARCHITECTURE</text>
    <text x="1155" y="325" text-anchor="end" fill="#00E5FF">STATUS: VERIFIED PROTOTYPE</text>
  </g>
</svg>