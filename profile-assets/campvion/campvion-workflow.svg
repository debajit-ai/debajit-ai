    <rect width="200" height="175" rx="5" fill="url(#boxAmber)" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="15" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#D4AF37">[STEP 03]</text>
    <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="900" fill="#FFFFFF">Workflow Suspended</text>
    <text x="15" y="70" font-family="ui-monospace, monospace" font-size="9" fill="#C4B5FD">Sensitive action flagged</text>
    <text x="15" y="85" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; State saved to SQLite</text>
    <text x="15" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Approval token issued</text>
    <text x="15" y="115" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">&#8226; Awaiting admin decision</text>
    <rect x="15" y="135" width="170" height="24" rx="3" fill="#241B0E" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="100" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#D4AF37">GATE: PENDING APPROVAL</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="705" y1="197" x2="735" y2="197" stroke="#00E5FF" stroke-width="1.5"/>
  <polygon points="735,197 727,193 727,201" fill="#00E5FF"/>

