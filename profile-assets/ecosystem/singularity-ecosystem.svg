<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="50%" stop-color="#0C0716"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <radialGradient id="centerCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#2E1065" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>

    <pattern id="ecoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E1065" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>

    <filter id="ecoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#ecoBg)"/>
  <rect width="1200" height="480" fill="url(#ecoGrid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="none" stroke="#2E1065" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="432" rx="6" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 15 435 L 15 465 L 45 465" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 1155 465 L 1185 465 L 1185 435" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(45, 50)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="900" letter-spacing="3px" fill="#FFFFFF">
      SINGULARITY HORIZON <tspan fill="#D4AF37">//</tspan> VENTURE &amp; PRODUCT ECOSYSTEM
    </text>
    <text x="0" y="18" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.5px" fill="#9CA3AF">
      SOVEREIGN PRODUCT FLEET &#8226; INTELLIGENT SYSTEMS INFRASTRUCTURE &#8226; LONG-TERM LEVERAGE
    </text>
  </g>

  <!-- Orbital Rings -->
  <ellipse cx="600" cy="250" rx="420" ry="140" fill="none" stroke="#2E1065" stroke-width="1.2" stroke-dasharray="6,4" stroke-opacity="0.6"/>
  <ellipse cx="600" cy="250" rx="260" ry="85" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Radiating Energy Lines from Center -->
  <line x1="600" y1="250" x2="220" y2="135" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="600" y1="250" x2="980" y2="135" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="600" y1="250" x2="220" y2="365" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="600" y1="250" x2="980" y2="365" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="600" y1="250" x2="600" y2="400" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- CENTER CORE: Singularity Horizon Technologies -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="85" fill="url(#centerCoreGlow)"/>
    <circle cx="0" cy="0" r="62" fill="#0B0714" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="0" cy="0" r="54" fill="#140D24" stroke="#7C3AED" stroke-width="1">
      <animate attributeName="r" values="52;56;52" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5px" fill="#D4AF37">
      SINGULARITY
    </text>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5px" fill="#FFFFFF">
      HORIZON
    </text>
    <text x="0" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" letter-spacing="1px" fill="#A78BFA">
      TECHNOLOGIES
    </text>
    <text x="0" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#9CA3AF">
      FOUNDER: D. GOSWAMI
    </text>
  </g>

  <!-- NODE 1: ORION HELIX AI (Top-Left) -->
  <g transform="translate(70, 95)">
    <rect width="300" height="80" rx="6" fill="#0D0817" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#D4AF37"/>
    <circle cx="20" cy="22" r="5" fill="#D4AF37"/>
    <text x="32" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">ORION HELIX AI</text>
    <rect x="210" y="12" width="78" height="18" rx="3" fill="#D4AF37" fill-opacity="0.15"/>
    <text x="249" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#D4AF37">FLAGSHIP</text>
    <text x="20" y="46" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Autonomous Generative &amp; Agentic AI Platform</text>
    <text x="20" y="63" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">Groq &#8226; Gemini &#8226; Socket.io &#8226; Node &#8226; FastAPI &#8226; MySQL</text>
  </g>

  <!-- NODE 2: CAMPVION (Top-Right) -->
  <g transform="translate(830, 95)">
    <rect width="300" height="80" rx="6" fill="#0D0817" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="296" y="0" width="4" height="80" rx="2" fill="#00E5FF"/>
    <circle cx="20" cy="22" r="5" fill="#00E5FF"/>
    <text x="32" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">CAMPVION (PROJECT 55)</text>
    <rect x="210" y="12" width="78" height="18" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="249" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#00E5FF">SHIPPED</text>
    <text x="20" y="46" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Intelligent Campus Operations &amp; Agent Assistant</text>
    <text x="20" y="63" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">TypeScript &#8226; Goal Decomp &#8226; Replanner &#8226; Human-in-Loop</text>
  </g>

  <!-- NODE 3: BLACK-WEB (Bottom-Left) -->
  <g transform="translate(70, 325)">
    <rect width="300" height="80" rx="6" fill="#0D0817" stroke="#7C3AED" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#7C3AED"/>
    <circle cx="20" cy="22" r="5" fill="#A78BFA"/>
    <text x="32" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">BLACK-WEB</text>
    <rect x="205" y="12" width="85" height="18" rx="3" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="247" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#C4B5FD">IN PROGRESS</text>
    <text x="20" y="46" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Personal AI Operating System &amp; Cyber Console</text>
    <text x="20" y="63" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">React &#8226; Vite &#8226; Framer &#8226; FastAPI &#8226; PostgreSQL</text>
  </g>

  <!-- NODE 4: DIGITAL IDENTITY (Bottom-Right) -->
  <g transform="translate(830, 325)">
    <rect width="300" height="80" rx="6" fill="#0D0817" stroke="#7C3AED" stroke-width="1.2"/>
    <rect x="296" y="0" width="4" height="80" rx="2" fill="#7C3AED"/>
    <circle cx="20" cy="22" r="5" fill="#A78BFA"/>
    <text x="32" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">3D COMPANY IDENTITY</text>
    <rect x="205" y="12" width="85" height="18" rx="3" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="247" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#C4B5FD">IN PROGRESS</text>
    <text x="20" y="46" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Cinematic 3D Navigable Web Experience</text>
    <text x="20" y="63" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">Three.js &#8226; R3F &#8226; GLSL Shaders &#8226; Zustand &#8226; GSAP</text>
  </g>

  <!-- NODE 5: NEXORA (Bottom-Center) -->
  <g transform="translate(470, 385)">
    <rect width="260" height="55" rx="5" fill="#0D0817" stroke="#2E1065" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#9CA3AF"/>
    <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">NEXORA</text>
    <rect x="165" y="9" width="85" height="18" rx="3" fill="#2E1065"/>
    <text x="207" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">EXPLORATORY</text>
    <text x="16" y="42" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">Distributed Architecture &amp; Systems Lab</text>
  </g>
</svg>