    </text>

    <!-- Divider inside badge -->
    <line x1="-55" y1="7" x2="55" y2="7" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.7"/>

    <text x="0" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1px" fill="#C4B5FD">
