    </text>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" letter-spacing="0.8px" fill="#A78BFA">
      TECHNOLOGIES PVT. LTD.
    </text>
    <text x="0" y="47" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" letter-spacing="1.5px" fill="#00E5FF">
      AI SYSTEMS ENGINEER
    </text>
  </g>

  <!-- NODE 1: ORION HELIX AI (Top-Left) -->
  <g transform="translate(60, 95)">
    <rect width="310" height="85" rx="6" fill="#0D0817" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="85" rx="2" fill="#D4AF37"/>
    <circle cx="20" cy="22" r="5" fill="#D4AF37"/>
    <text x="32" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">ORION HELIX AI</text>
    <rect x="215" y="12" width="85" height="18" rx="3" fill="#D4AF37" fill-opacity="0.15"/>
    <text x="257" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#D4AF37">FLAGSHIP</text>
    <text x="20" y="47" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Generative AI Evolving Toward Agentic Intelligence</text>
    <text x="20" y="65" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">Groq &#8226; Gemini &#8226; Socket.io &#8226; Node &#8226; FastAPI &#8226; MySQL</text>
  </g>

  <!-- NODE 2: CAMPVION — PROJECT 55 (Top-Right) -->
  <g transform="translate(830, 95)">
    <rect width="310" height="85" rx="6" fill="#0D0817" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="306" y="0" width="4" height="85" rx="2" fill="#00E5FF"/>
    <circle cx="20" cy="22" r="5" fill="#00E5FF"/>
    <text x="32" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">CAMPVION (PROJECT 55)</text>
    <rect x="215" y="12" width="85" height="18" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="257" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#00E5FF">PROTOTYPE</text>
    <text x="20" y="47" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Intelligent Campus Ops with Human Approval Gate</text>
    <text x="20" y="65" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">Next.js &#8226; Python &#8226; FastAPI &#8226; SQLite &#8226; Execution Trace</text>
  </g>

  <!-- NODE 3: BLACK-WEB (Bottom-Left) -->
  <g transform="translate(60, 345)">
    <rect width="310" height="85" rx="6" fill="#0D0817" stroke="#7C3AED" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="85" rx="2" fill="#7C3AED"/>
    <circle cx="20" cy="22" r="5" fill="#A78BFA"/>
    <text x="32" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">BLACK-WEB</text>
    <rect x="215" y="12" width="85" height="18" rx="3" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="257" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#C4B5FD">IN PROGRESS</text>
    <text x="20" y="47" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Personal AI OS &#8226; Cyber-Operator Dashboard</text>
    <text x="20" y="65" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">React &#8226; Vite &#8226; Framer &#8226; FastAPI &#8226; PostgreSQL</text>
  </g>

  <!-- NODE 4: SINGULARITY HORIZON WEBSITE (Bottom-Right) -->
  <g transform="translate(830, 345)">
    <rect width="310" height="85" rx="6" fill="#0D0817" stroke="#7C3AED" stroke-width="1.2"/>
    <rect x="306" y="0" width="4" height="85" rx="2" fill="#7C3AED"/>
    <circle cx="20" cy="22" r="5" fill="#A78BFA"/>
    <text x="32" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">3D COMPANY IDENTITY</text>
    <rect x="215" y="12" width="85" height="18" rx="3" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="257" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#C4B5FD">IN PROGRESS</text>
    <text x="20" y="47" font-family="ui-monospace, monospace" font-size="9.5" fill="#C4B5FD">Cinematic Spatial 3D Web Experience</text>
    <text x="20" y="65" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">Three.js &#8226; R3F &#8226; GLSL &#8226; Zustand &#8226; GSAP</text>
  </g>

  <!-- NODE 5: NEXORA (Bottom-Center) -->
  <g transform="translate(465, 415)">
    <rect width="270" height="60" rx="5" fill="#0D0817" stroke="#2E1065" stroke-width="1.2"/>
    <circle cx="16" cy="20" r="4" fill="#9CA3AF"/>
    <text x="28" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">NEXORA</text>
    <rect x="175" y="10" width="85" height="18" rx="3" fill="#2E1065"/>
    <text x="217" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#9CA3AF">EXPLORATORY</text>
    <text x="16" y="44" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">Distributed Architecture &amp; Systems Lab</text>
