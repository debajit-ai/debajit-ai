<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="feBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="50%" stop-color="#0C0716"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <radialGradient id="feCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <pattern id="feGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E1065" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="url(#feBg)"/>
  <rect width="1200" height="520" fill="url(#feGrid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="480" rx="8" fill="none" stroke="#2E1065" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="472" rx="6" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.4"/>

  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 15 475 L 15 505 L 45 505" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 1155 505 L 1185 505 L 1185 475" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(45, 52)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="3px" fill="#FFFFFF">
      THE FOUNDER-CENTRIC TECHNOLOGY ECOSYSTEM
    </text>
    <text x="0" y="20" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.5px" fill="#9CA3AF">
      FOUNDER-LED SOVEREIGN VENTURE &#8226; AI SYSTEMS ARCHITECTURE &#8226; MULTI-PROJECT FLEET
    </text>
  </g>

  <!-- Orbital Rings -->
  <ellipse cx="600" cy="270" rx="440" ry="160" fill="none" stroke="#2E1065" stroke-width="1.2" stroke-dasharray="6,4" stroke-opacity="0.6"/>
  <ellipse cx="600" cy="270" rx="280" ry="100" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Energy Pathways connecting to Center -->
  <line x1="600" y1="270" x2="210" y2="140" stroke="#00B7FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="600" y1="270" x2="990" y2="140" stroke="#00B7FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="600" y1="270" x2="210" y2="390" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="600" y1="270" x2="990" y2="390" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="600" y1="270" x2="600" y2="435" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- ==================== CENTRAL NODE: DEBAJIT GOSWAMI ==================== -->
  <g transform="translate(600, 270)">
    <circle cx="0" cy="0" r="105" fill="url(#feCore)"/>
    <circle cx="0" cy="0" r="82" fill="#0B0714" stroke="#D4AF37" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="74" fill="#140D24" stroke="#7C3AED" stroke-width="1.2">
      <animate attributeName="r" values="72;76;72" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Founder Crest Marker -->
    <polygon points="0,-62 -8,-48 8,-48" fill="#D4AF37"/>

    <!-- Prominent Founder Typography -->
    <text x="0" y="-22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="900" letter-spacing="2.5px" fill="#FFFFFF">
      DEBAJIT GOSWAMI
    </text>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="2px" fill="url(#goldText)">
